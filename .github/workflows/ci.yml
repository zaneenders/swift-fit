name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"
      - name: Run tests with coverage
        run: swift test --enable-code-coverage

  wasm:
    name: Embedded WebAssembly build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"
      - name: Install the matching WebAssembly SDK
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
      - name: Compile libraries for embedded WebAssembly
        run: |
          swift build -c release --swift-sdk swift-6.3.3-RELEASE_wasm-embedded --target SwiftFit
          swift build -c release --swift-sdk swift-6.3.3-RELEASE_wasm-embedded --target SwiftFitActivity
